<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" fill="#000000" rx="48" />

  <!-- XP Monogram for Xpaid -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
    <!-- X Glyph: Italicized outlined letter X with horizontal caps -->
    <!-- Diagonal 1: Top-Left to Bottom-Right -->
    <polygon 
      points="52,170 102,170 222,342 172,342" 
      fill="#000000" 
      stroke="#FFFFFF" 
      stroke-width="16" 
    />
    <!-- Diagonal 2: Top-Right to Bottom-Left -->
    <polygon 
      points="220,170 170,170 50,342 100,342" 
      fill="#000000" 
      stroke="#FFFFFF" 
      stroke-width="16" 
    />

    <!-- P Glyph: Custom geometric payment glyph with top vertical prong, rounded loop, and slanted stem -->
    <!-- Outlined unified path -->
    <path 
      d="
        M 310 96 
        L 395 96 
        L 364 148 
        L 395 148 
        C 455 148 460 205 460 236 
        C 460 305 410 336 345 336 
        L 282 336 
        L 250 410 
        L 296 410 
        L 326 336 
        L 345 336 
        C 445 336 500 290 500 236 
        C 500 130 420 96 345 96 
        Z
      "
      fill="#000000"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linejoin="miter"
    />
    <!-- Stylized inner loop and stem cut of the P matching the photo -->
    <path
      d="
        M 312 96
        L 396 96
        L 362 152
        L 402 152
        C 445 152 460 185 460 232
        C 460 280 435 336 352 336
        L 285 336
        L 252 410
        L 300 410
        L 328 348
        L 352 348
        C 440 348 488 296 488 232
        C 488 170 445 130 380 130
        L 342 130
        L 332 152
        Z
      "
      fill="none"
    />
  </g>
</svg>
