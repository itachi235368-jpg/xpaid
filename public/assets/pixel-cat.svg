<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Sky Blue Background -->
  <rect width="400" height="400" fill="#38B6FF"/>

  <!-- Pixel Grid (20x20 blocks of 20px each) -->
  <g fill="#FFE600">
    <!-- Cat Ears & Head Shape in Yellow Pixels -->
    <!-- Left Ear -->
    <rect x="80" y="40" width="40" height="120"/>
    <rect x="120" y="80" width="20" height="80"/>
    <rect x="140" y="100" width="20" height="60"/>
    <!-- Right Ear -->
    <rect x="280" y="40" width="40" height="120"/>
    <rect x="260" y="80" width="20" height="80"/>
    <rect x="240" y="100" width="20" height="60"/>
    <!-- Ear Bridge -->
    <rect x="160" y="120" width="80" height="40"/>
    <!-- Main Face Body -->
    <rect x="60" y="160" width="280" height="160"/>
    <rect x="80" y="320" width="240" height="40"/>
    <rect x="120" y="360" width="160" height="20"/>
  </g>

  <!-- Black Pixel Details (Eyes, Whiskers, Nose) -->
  <g fill="#1A1A24">
    <!-- Left Eye -->
    <rect x="120" y="180" width="40" height="60"/>
    <!-- Right Eye -->
    <rect x="240" y="160" width="40" height="80"/>

    <!-- Nose / Mouth Dot -->
    <rect x="190" y="260" width="20" height="16"/>

    <!-- Left Whiskers -->
    <rect x="40" y="240" width="80" height="14"/>
    <rect x="40" y="280" width="80" height="14"/>
    <rect x="80" y="330" width="60" height="14"/>

    <!-- Right Whiskers -->
    <rect x="280" y="240" width="80" height="14"/>
    <rect x="280" y="280" width="80" height="14"/>
    <rect x="260" y="330" width="60" height="14"/>
  </g>

  <!-- White Eye Highlights -->
  <g fill="#FFFFFF">
    <!-- Left Eye Highlight -->
    <rect x="135" y="190" width="18" height="24"/>
    <!-- Right Eye Highlight -->
    <rect x="255" y="170" width="18" height="34"/>
  </g>
</svg>
