<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#4B8C3E"/>
  <!-- Pepe Head Outline & Base -->
  <g stroke="#162912" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head Base -->
    <path d="M 60,390 C 40,250 80,100 200,90 C 310,80 370,160 360,280 C 350,370 290,395 240,400" fill="#58A846"/>
    
    <!-- Left Eye Ridge & Eye -->
    <path d="M 110,140 C 130,110 210,115 230,145 C 210,175 130,170 110,140 Z" fill="#FFFFFF"/>
    <ellipse cx="165" cy="142" rx="26" ry="24" fill="#162912"/>
    <circle cx="155" cy="135" r="7" fill="#FFFFFF"/>
    <circle cx="175" cy="148" r="4" fill="#FFFFFF"/>
    <!-- Eyelids -->
    <path d="M 105,138 C 145,100 205,105 235,142" fill="none" stroke-width="10"/>
    <path d="M 115,165 C 155,185 200,180 225,155" fill="none" stroke-width="7"/>

    <!-- Right Eye Ridge & Eye -->
    <path d="M 235,145 C 255,115 330,120 345,150 C 330,180 255,175 235,145 Z" fill="#FFFFFF"/>
    <ellipse cx="288" cy="146" rx="26" ry="24" fill="#162912"/>
    <circle cx="278" cy="139" r="7" fill="#FFFFFF"/>
    <circle cx="298" cy="152" r="4" fill="#FFFFFF"/>
    <!-- Right Eyelids -->
    <path d="M 230,142 C 265,105 325,110 350,148" fill="none" stroke-width="10"/>
    <path d="M 240,168 C 280,188 320,182 342,160" fill="none" stroke-width="7"/>

    <!-- Nostril -->
    <path d="M 215,190 C 218,198 228,198 230,190" fill="none" stroke-width="6"/>

    <!-- Iconic Big Pepe Red Lips Smirk -->
    <path d="M 90,225 C 160,265 290,265 340,215 C 345,230 330,285 280,290 C 190,300 110,270 90,225 Z" fill="#A83024"/>
    <path d="M 90,225 C 170,250 270,250 340,215" fill="none" stroke-width="8"/>

    <!-- Chin Line & Wrinkles -->
    <path d="M 180,305 C 220,315 260,310 280,300" fill="none" stroke-width="6"/>
    <path d="M 140,110 C 180,95 240,95 270,110" fill="none" stroke-width="6"/>

    <!-- Pepe Thinking Hand on Chin -->
    <path d="M 210,390 C 205,330 250,300 295,305 C 330,310 355,340 370,395 Z" fill="#58A846"/>
    <!-- Finger pointing at chin -->
    <path d="M 240,325 C 225,320 215,335 220,350 C 230,370 270,380 290,370" fill="#58A846" stroke-width="7"/>
    <path d="M 260,345 C 275,340 295,355 290,375" fill="none" stroke-width="6"/>
    <path d="M 290,355 C 310,350 330,365 320,385" fill="none" stroke-width="6"/>
  </g>
</svg>
