    <ellipse cx="235" cy="170" rx="15" ry="9" fill="#FFFFFF"/>
    <ellipse cx="233" cy="170" rx="7" ry="8" fill="#2B241C"/>
    <circle cx="231" cy="167" r="2.5" fill="#FFFFFF"/>
    <path d="M 215,166 C 230,160 248,162 255,172" fill="none" stroke="#2B241C" stroke-width="3.5"/>

