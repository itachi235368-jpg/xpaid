<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Cyan Aura -->
    <radialGradient id="xpaidBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#0891b2" />
      <stop offset="60%" stop-color="#0f3742" />
      <stop offset="85%" stop-color="#0a1820" />
      <stop offset="100%" stop-color="#03080c" />
    </radialGradient>

    <!-- 3D Shadow filter -->
    <filter id="xpaidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="url(#xpaidBg)" />

  <!-- Ambient Orbit Rings -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 12" />
  <circle cx="512" cy="512" r="450" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- 3D Isometric Payment Bubble Emblem -->
  <g filter="url(#xpaidShadow)">
    <path 
      d="
        M 346 172 
        L 835 172 
        L 835 558 
        L 592 801 
        L 346 801 
        L 346 935 
        L 182 795 
        L 182 300 
        Z
      " 
      fill="#04070b" 
      stroke="#0891b2"
      stroke-width="3"
      stroke-opacity="0.4"
    />

    <path 
      d="
        M 346 172 
        L 835 172 
        L 835 558 
        L 592 801 
        L 346 801 
        Z
      " 
      fill="#090e15" 
    />

    <path 
      d="
        M 386 226 
        L 783 226 
        L 783 536 
        L 572 746 
        L 468 746 
        L 468 820 
        L 386 746 
        Z
      " 
      fill="#FFFFFF" 
    />

    <!-- The 𝕏 Mark: Precision Geometric X -->
    <polygon 
      points="
        680,270 
        750,270 
        490,695 
        420,695
      " 
      fill="#090e15" 
    />

    <polygon 
      points="
        430,270 
        500,270 
        575,372 
        515,385
      " 
      fill="#090e15" 
    />
    
    <polygon 
      points="
        645,480 
        705,470 
        755,695 
        685,695
      " 
      fill="#090e15" 
    />

    <polygon 
      points="
        450,270 
        478,270 
        738,695 
        710,695
      " 
      fill="#06b6d4" 
    />

    <circle cx="715" cy="270" r="10" fill="#22d3ee" />
    <circle cx="455" cy="695" r="10" fill="#10b981" />
  </g>
